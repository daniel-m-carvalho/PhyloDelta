<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>phylo.io — navigation benchmark</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #panels { display: flex; height: 100vh; }
      #left, #right { flex: 1 1 0; border-right: 1px solid #ddd; overflow: hidden; }
    </style>
    <script src="/phyloio/dist/src_worker_bcn_js.phylo.js"></script>
    <script src="/phyloio/dist/src_worker_distance_js.phylo.js"></script>
    <script src="/phyloio/dist/phylo.js"></script>
  </head>
  <body>
    <div id="panels"><div id="left"></div><div id="right"></div></div>

    <script>
      /*
       * Navigating phylo.io, driven the way its own context menu drives it.
       *
       * Every operation below calls `container.trigger_(action, node.data,
       * node)`, which is *literally* what the menu items do — `viewer.js` line
       * 1137 for Collapse/Expand and the `'BCN'` branch of `container.js`
       * `trigger_` for "find in the other tree". Nothing here reaches past the
       * menu's own entry point into the rendering internals, so what is timed
       * is phylo.io doing its job, not a reimplementation of it.
       *
       * The counterpart on the PhyloDelta side calls that app's menu actions
       * (`focus`, `back`, `focusWithContext`) for the same reason. Both are
       * driven one layer below the click, which is the only way the two can be
       * compared without one of them also paying for canvas hit-testing.
       *
       * Unlike `phyloio.html`, this page KEEPS the containers. Navigation is a
       * sequence of operations on a loaded comparison, so the driver has to
       * come back to the same instance between measurements.
       */
      let phylo = null;
      let c1 = null;
      let c2 = null;

      /** Resolves after the browser has actually painted, not after the call. */
      const painted = () =>
        new Promise((res) => requestAnimationFrame(() => requestAnimationFrame(res)));

      /**
       * `limit` candidates spread across clade sizes: one size class (a power of
       * two) at a time, largest first, round-robin, so a sample of eight is not
       * eight clades of one size.
       *
       * The first harness took the largest N. On the pruned rungs those are
       * exactly the clades whose counterpart is the other tree's root — the
       * eight largest at 1,000 leaves, 922 to 997 leaves each — which is the one
       * case where phylo.io's jump throws, so it measured that case eight times
       * and reported the jump as failing in most loads (§34.24).
       */
      function acrossSizes(nodes, limit) {
        const classes = new Map();
        for (const node of [...nodes].sort((x, y) => y.leaves - x.leaves || x.at - y.at)) {
          const k = Math.floor(Math.log2(node.leaves));
          if (!classes.has(k)) classes.set(k, []);
          classes.get(k).push(node);
        }
        const order = [...classes.keys()].sort((x, y) => y - x);
        const picked = [];
        for (let round = 0; picked.length < limit; round += 1) {
          let any = false;
          for (const k of order) {
            const node = classes.get(k)[round];
            if (node && picked.length < limit) {
              picked.push(node);
              any = true;
            }
          }
          if (!any) break;
        }
        return picked;
      }

      window.__nav = {
        async load(leftUrl, rightUrl, compareBudgetMs) {
          const [a, b] = await Promise.all([
            fetch(leftUrl).then((r) => r.text()),
            fetch(rightUrl).then((r) => r.text()),
          ]);

          phylo = PhyloIO.init();
          c1 = phylo.create_container("left");
          c2 = phylo.create_container("right");
          phylo.settings.compareMode = true;
          phylo.bound_container = [c1, c2];
          c1.add_tree(a);
          c2.add_tree(b);
          phylo.start();
          await painted();

          // The BCN worker must finish or "find in the other tree" has nothing
          // to find: `elementBCN` is populated by it. A navigation measurement
          // taken before it lands would be measuring an unfinished tool.
          const deadline = performance.now() + (compareBudgetMs || 600000);
          while (performance.now() < deadline) {
            if (c1.message_loader === null || c1.message_loader === undefined) {
              return { ready: true };
            }
            await new Promise((r) => setTimeout(r, 250));
          }
          return { ready: false };
        },

        /**
         * Candidate nodes to navigate on.
         *
         * `_children` present means d3 is holding the subtree back — the node
         * is collapsed, so expanding it is real work. `children` present means
         * it is open and can be collapsed. Both are offered with their leaf
         * count so the driver can match targets against the other tool by
         * size, which is the only basis the two have in common: a phylo.io
         * node is identified by its leaf set and a PhyloDelta node by a stored
         * index.
         *
         * Each candidate also says whether its best corresponding node is the
         * **other tree's root** (`bcnIsRoot`). That is the one case in which
         * phylo.io 2.2.5's "Highlight BCN" throws (§34.24): `elementBCN` then
         * points at a detached copy of the root, `getHierarchyNodeFromModelNode`
         * returns null, and the action reads `_children` of null. The root is
         * recognised by its leaf count — every leaf of the other tree — because
         * the detached copy is not the root object the panel holds.
         */
        candidates(limit) {
          const out = [];
          const uid = c2.viewer.model.uid;
          const otherRoot = c2.viewer.hierarchy;
          const otherLeaves = Array.isArray(otherRoot.data.leaves) ? otherRoot.data.leaves.length : 0;
          const walk = (d) => {
            const kids = d.children || d._children;
            if (!kids) return;
            // `leaves` is the array of leaf nodes; `deepLeafList` is NOT it —
            // it counts every node, reporting 1,998 for a 1,000-leaf tree. The
            // other tool's `true_leaf_count` is leaves, so using deepLeafList
            // would have compared two different quantities under one heading.
            const leaves = Array.isArray(d.data.leaves) ? d.data.leaves.length : 0;
            if (leaves > 1) {
              const target = d.data.elementBCN ? d.data.elementBCN[uid] : undefined;
              const targetLeaves =
                target && Array.isArray(target.leaves) ? target.leaves.length : null;
              // `at` indexes __navNodes, which is how the driver names a node
              // back to this page: a d3 node cannot cross into Playwright.
              out.push({
                at: window.__navNodes.push(d) - 1,
                leaves,
                collapsed: Boolean(d.data.collapse),
                hasBcn: Boolean(target),
                bcnLeaves: targetLeaves,
                bcnIsRoot: Boolean(target) && (target === otherRoot.data || targetLeaves === otherLeaves),
              });
            }
            for (const k of kids) walk(k);
          };
          window.__navNodes = [];
          walk(c1.viewer.hierarchy);
          const jumpable = out.filter((c) => c.hasBcn && !c.bcnIsRoot);
          const rootward = out.filter((c) => c.bcnIsRoot);
          return {
            all: out.length,
            // Expand and back: across sizes, any clade.
            sampled: acrossSizes(out, limit || 12),
            // The jump: across sizes, among the clades it can work on.
            jump: acrossSizes(jumpable, limit || 12),
            // The case it cannot: every clade whose counterpart is the root,
            // counted, and tried separately so the failure is confirmed rather
            // than assumed.
            rootward,
            with_bcn: out.filter((c) => c.hasBcn).length,
          };
        },
        /** Collapse or expand one node, exactly as the menu item does. */
        async toggle(at) {
          const node = window.__navNodes[at];
          try {
            const t0 = performance.now();
            c1.trigger_("collapse", node.data, node);
            await painted();
            return { ms: performance.now() - t0, collapsed: Boolean(node.data.collapse) };
          } catch (failed) {
            return { error: String((failed && failed.message) || failed) };
          }
        },

        /**
         * "Find in the other tree", exactly as the menu item does.
         *
         * Returns `{ms}` or `{error}` rather than throwing: this operation does
         * not survive in compare mode (see below), and letting the exception
         * cross into the driver would cost the expand and back measurements
         * their cell too.
         *
         * **Where it fails.** Only on a clade whose best corresponding node is
         * the other tree's root (`bcnIsRoot` above): `elementBCN` then points at
         * a detached copy of the root, `getHierarchyNodeFromModelNode` returns
         * null, and `expandToRoot` hands that null to
         * `apply_collapse_from_data_to_d3`, which reads `d._children`. Every
         * other clade's jump works, in every load (§34.24). The first harness
         * read this as a general failure because it sampled only the largest
         * clades, which are the root's counterparts.
         */
        async bcn(at) {
          const node = window.__navNodes[at];
          const uid = c2.viewer.model.uid;
          if (!node.data.elementBCN || !node.data.elementBCN[uid]) {
            return { error: "no BCN recorded for this node" };
          }
          const target = node.data.elementBCN[uid];
          let reachable = false;
          const seek = (n) => {
            if (n.data === target) reachable = true;
            const kids = n.children || n._children;
            if (kids) kids.forEach(seek);
          };
          seek(c2.viewer.hierarchy);
          try {
            const t0 = performance.now();
            c1.trigger_("BCN", node.data, node);
            await painted();
            return { ms: performance.now() - t0, reachable };
          } catch (failed) {
            return {
              error: String((failed && failed.message) || failed),
              reachable,
              targetHasParent: Boolean(target.parent),
            };
          }
        },

        /**
         * Re-root the left tree above the clade with exactly these leaves, as the
         * context menu's "Reroot" does, and time it until the comparison has been
         * recomputed and painted (§34.24).
         *
         * `trigger_("reroot", …)` re-roots the model and calls
         * `compute_topology_and_render_bounded_viewer(true)`, which starts the
         * similarity worker again over both trees and sets `message_loader`
         * synchronously. The clock stops when the worker clears it — as the
         * first comparison is timed — and two frames later.
         */
        async reroot(labels, budgetMs) {
          const want = new Set(labels.map(String));
          let found = null;
          const seek = (d) => {
            if (found) return;
            const leaves = Array.isArray(d.data.leaves) ? d.data.leaves : [];
            if (leaves.length === want.size && leaves.every((leaf) => want.has(String(leaf.name)))) {
              found = d;
              return;
            }
            if (leaves.length < want.size) return;
            for (const k of d.children || d._children || []) seek(k);
          };
          seek(c1.viewer.hierarchy);
          if (!found) return { error: `no clade with these ${want.size} leaves` };
          const t0 = performance.now();
          try {
            c1.trigger_("reroot", found.data, found);
          } catch (failed) {
            return { error: String((failed && failed.message) || failed) };
          }
          const started = c1.message_loader !== null && c1.message_loader !== undefined;
          const deadline = t0 + (budgetMs || 600000);
          while (performance.now() < deadline) {
            if (c1.message_loader === null || c1.message_loader === undefined) {
              await painted();
              return { ms: performance.now() - t0, recomputed: started, finished: true };
            }
            await new Promise((r) => setTimeout(r, 50));
          }
          return { ms: performance.now() - t0, recomputed: started, finished: false };
        },

        /** What is on screen, so a row can say what was actually drawn. */
        drawn() {
          return {
            paths: document.querySelectorAll("path").length,
            texts: document.querySelectorAll("text").length,
            circles: document.querySelectorAll("circle").length,
          };
        },
      };
      window.__navReady = true;
    </script>
  </body>
</html>
